name: Daily Pyrolysis Update

on:
  # 定时触发已禁用，改用本地定时任务（Windows任务计划程序）
  # 如需恢复自动运行，取消下面的注释即可
  # schedule:
  #   - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      reason:
        description: '手动触发原因'
        required: false
        default: '备用部署'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pytz playwright

      # 🔥 修复：安装Chromium（Ubuntu系统只有这个，没有Chrome）
      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run daily update
        run: python pyro_daily_update.py

      - name: Prepare CNAME
        run: echo "pyrolysis-daily.store" > CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html CNAME
          git diff --cached --quiet || git commit -m "chore: daily update $(date +'%Y-%m-%d')"
          git push --force
